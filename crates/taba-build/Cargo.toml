[package]
name = "taba-build"
description = "Build-time bundling for Taba, a Rolldown-based TypeScript bundler for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
bundle = ["dep:taba-rolldown", "dep:tokio"]

[dependencies]
taba-rolldown = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[[test]]
name = "bundle"
required-features = ["bundle"]

[lints]
workspace = true
