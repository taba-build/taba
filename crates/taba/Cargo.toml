[package]
name = "taba"
description = "Runtime for Taba, a Rolldown-based TypeScript bundler for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true

[features]
rpc = ["dep:serde", "serde_json/raw_value", "dep:specta", "dep:specta-typescript"]

[dependencies]
serde = { workspace = true, optional = true, features = ["alloc", "derive"] }
serde_core.workspace = true
serde_json = { workspace = true, features = ["alloc"] }
specta = { workspace = true, optional = true }
specta-typescript = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
