[package]
name = "taba"
description = "Runtime for Taba, a Rolldown-based TypeScript bundler for Rust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
derive = ["dep:taba-derive"]
rpc = [
  "std",
  "dep:futures-util",
  "dep:serde",
  "serde_json/raw_value",
  "dep:tokio",
  "dep:tokio-util",
]
std = []

[dependencies]
futures-util = { workspace = true, optional = true, features = ["std"] }
serde = { workspace = true, optional = true, features = ["alloc", "derive"] }
serde_core.workspace = true
serde_json = { workspace = true, features = ["alloc"] }
taba-derive = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }
tokio-util = { workspace = true, optional = true, features = ["join-map"] }

# enforce the pin for things that depend directly on taba-derive, see https://github.com/matklad/macro-dep-test
[target.'cfg(any())'.dependencies]
taba-derive.workspace = true

[dev-dependencies]
insta.workspace = true
rustversion.workspace = true
taba-derive.workspace = true
tokio = { workspace = true, features = ["test-util"] }
trybuild.workspace = true

[lints]
workspace = true
