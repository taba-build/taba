[workspace]
resolver = "3"
members = ["crates/*", "xtask", "xtask/generate"]
default-members = ["crates/*"]

[workspace.dependencies]
# workspace
taba = { version = "=0.0.2", path = "crates/taba" }
taba-build = { version = "=0.0.2", path = "crates/taba-build" }
taba-derive = { version = "=0.0.2", path = "crates/taba-derive" }
taba-rolldown = { version = "=0.0.2", path = "crates/taba-rolldown" }

# dependencies
futures-util = { version = "0.3.34", default-features = false }
insta = { version = "1.49.0", default-features = false }
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }
rustversion = { version = "1.0.23", default-features = false }
serde = { version = "1.0.229", default-features = false }
serde_core = { version = "1.0.229", default-features = false }
serde_derive_internals = { version = "=0.30.0", default-features = false }
serde_json = { version = "1.0.154", default-features = false }
sugar_path = { version = "3.0.0", default-features = false }
syn = { version = "3.0.10", default-features = false }
tauri = { version = "2.12.5", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
trybuild = { version = "1.0.122", default-features = false }

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.package]
version = "0.0.2" # sync public facing crates only
rust-version = "1.95"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Chip Reed <chip@chip.sh>"]
repository = "https://github.com/taba-build/taba"
readme = "README.md"
