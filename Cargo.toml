[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.dependencies]
futures-util = { version = "0.3.34", default-features = false }
insta = "1.49.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rustversion = "1.0.23"
serde = { version = "1.0.229", default-features = false }
serde_core = { version = "1.0.229", default-features = false }
serde_derive_internals = "=0.30.0"
serde_json = { version = "1.0.154", default-features = false }
syn = "3.0.10"
taba = { version = "0.0.1", path = "crates/taba" }
taba-derive = { version = "=0.0.1", path = "crates/taba-derive" }
taba-rolldown = { version = "0.0.1", path = "crates/taba-rolldown" }
tauri = { version = "2.12.5", default-features = false }
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
trybuild = "1.0.122"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.package]
version = "0.0.1" # sync public facing crates only
rust-version = "1.95"
edition = "2024"
license = "Apache-2.0 OR MIT"
authors = ["Chip Reed <chip@chip.sh>"]
repository = "https://github.com/taba-build/taba"
readme = "README.md"
